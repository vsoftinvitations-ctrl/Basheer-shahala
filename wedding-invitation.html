  <style>
    @font-face {
      font-family: 'Brittany Signature';
      src: url('/fonts/BrittanySignature.woff') format('woff'),
        url('fonts/BrittanySignature.woff') format('woff'),
        url('https://fonts.cdnfonts.com/s/39082/BrittanySignature-LjyZ.woff') format('woff');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --ivory: #faf6ee;
      --cream: #f3ece0;
      --blush: #f4e6e0;
      --gold: #b8985a;
      --gold-soft: #dcc9a0;
      --ink: #3b342b;
      --mute: #7d7365;
      --serif: 'Cormorant Garamond', Georgia, serif;
      --sans: 'DM Sans', system-ui, sans-serif;
      --script: 'Alex Brush', 'Great Vibes', cursive;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px)
    }

    *,
    *::before,
    *::after {
      box-sizing: inherit
    }

    html {
      scroll-behavior: smooth;
      scroll-padding-top: env(safe-area-inset-top, 0px)
    }

    body {
      margin: 0;
      background: var(--ivory);
      color: var(--ink);
      font-family: var(--sans);
      font-weight: 300;
      line-height: 1.7;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased
    }

    section {
      padding: clamp(72px, 14vw, 140px) 24px;
      text-align: center;
      position: relative
    }

    .wrap {
      max-width: 560px;
      margin: 0 auto
    }

    .label {
      font-size: .7rem;
      letter-spacing: .32em;
      text-transform: uppercase;
      color: var(--gold);
      font-weight: 400;
      margin: 0 0 28px
    }

    h1,
    h2,
    h3,
    .serif {
      font-family: var(--serif);
      font-weight: 400;
      margin: 0
    }

    .names {
      font-family: var(--script);
      font-weight: 400;
      font-size: clamp(3.2rem, 13vw, 5.2rem);
      line-height: 1.2;
      letter-spacing: .02em
    }

    .intro-names {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 0 auto;
      position: relative;
      text-align: center;
      overflow: visible;
    }

    .script-line {
      position: relative;
      display: inline-block;
      line-height: 1.2;
      padding: 0.05em 0.8em;
      overflow: visible;
    }

    .script-text {
      display: inline-block;
      font-family: var(--script);
      font-size: clamp(3.2rem, 12.5vw, 5.2rem);
      font-weight: 400;
      color: #1a140e;
      letter-spacing: .02em;
      white-space: nowrap;
      padding: 0.08em 0.3em;
      margin: -0.08em -0.3em;
      overflow: visible;
      will-change: clip-path, opacity;
    }

    .intro-names .script-text {
      color: #1a140e !important;
      text-shadow: none !important;
    }

    .script-groom .script-text,
    .script-bride .script-text {
      clip-path: inset(-60px 105% -60px -60px);
      opacity: 0;
    }

    .script-amp {
      overflow: visible;
    }

    .script-amp .amp,
    .intro-names .script-amp .amp {
      font-family: var(--serif);
      font-style: italic;
      color: #1a140e !important;
      text-shadow: none !important;
      font-size: clamp(1.6rem, 5.5vw, 2.3rem);
      opacity: 0;
      transform: scale(.6) rotate(-8deg);
      display: block;
      margin: 2px 0;
      transition: transform .6s ease;
    }

    .calligraphy-spark {
      position: absolute;
      top: 52%;
      left: 0;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 0 8px 2px #fff2a8, 0 0 16px 4px rgba(235, 205, 130, .95), 0 0 24px 6px rgba(212, 175, 55, .85);
      pointer-events: none;
      opacity: 0;
      transform: translate(-50%, -50%);
      will-change: left, opacity;
    }

    .flourish-wrap {
      width: clamp(200px, 62vw, 300px);
      height: 24px;
      margin: .1rem auto 0;
      overflow: visible;
    }

    .calligraphy-flourish {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    .flourish-path {
      stroke-dasharray: 320;
      stroke-dashoffset: 320;
    }

    .intro-names.in .script-groom .script-text {
      animation: writeGroom 1.7s cubic-bezier(.35, 0, .25, 1) .3s forwards;
    }

    .intro-names.in .script-groom .calligraphy-spark {
      animation: sparkMoveGroom 1.7s cubic-bezier(.35, 0, .25, 1) .3s forwards;
    }

    .intro-names.in .script-amp .amp {
      animation: revealAmp .7s cubic-bezier(.34, 1.56, .64, 1) 1.8s forwards;
    }

    .intro-names.in .script-bride .script-text {
      animation: writeBride 1.5s cubic-bezier(.35, 0, .25, 1) 2.3s forwards;
    }

    .intro-names.in .script-bride .calligraphy-spark {
      animation: sparkMoveBride 1.5s cubic-bezier(.35, 0, .25, 1) 2.3s forwards;
    }

    .intro-names.in .flourish-path {
      animation: drawFlourish 1.1s cubic-bezier(.25, 1, .5, 1) 3.6s forwards;
    }

    @keyframes writeGroom {
      0% {
        clip-path: inset(-60px 105% -60px -60px);
        opacity: 1;
      }

      100% {
        clip-path: inset(-60px -60px -60px -60px);
        opacity: 1;
      }
    }

    @keyframes sparkMoveGroom {
      0% {
        left: 0%;
        opacity: 0;
        transform: translate(-50%, -50%) scale(.4);
      }

      6% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1.3);
      }

      92% {
        left: 100%;
        opacity: 1;
        transform: translate(-50%, -50%) scale(1.1);
      }

      100% {
        left: 100%;
        opacity: 0;
        transform: translate(-50%, -50%) scale(.2);
      }
    }

    @keyframes revealAmp {
      0% {
        opacity: 0;
        transform: scale(.6) rotate(-8deg);
      }

      100% {
        opacity: 1;
        transform: scale(1) rotate(0deg);
      }
    }

    @keyframes writeBride {
      0% {
        clip-path: inset(-60px 105% -60px -60px);
        opacity: 1;
      }

      100% {
        clip-path: inset(-60px -60px -60px -60px);
        opacity: 1;
      }
    }

    @keyframes sparkMoveBride {
      0% {
        left: 0%;
        opacity: 0;
        transform: translate(-50%, -50%) scale(.4);
      }

      6% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1.3);
      }

      92% {
        left: 100%;
        opacity: 1;
        transform: translate(-50%, -50%) scale(1.1);
      }

      100% {
        left: 100%;
        opacity: 0;
        transform: translate(-50%, -50%) scale(.2);
      }
    }

    @keyframes drawFlourish {
      0% {
        stroke-dashoffset: 320;
      }

      100% {
        stroke-dashoffset: 0;
      }
    }

    @media(prefers-reduced-motion:reduce) {

      .script-groom .script-text,
      .script-bride .script-text {
        clip-path: none !important;
        opacity: 1 !important;
        animation: none !important;
      }

      .script-amp .amp {
        opacity: 1 !important;
        transform: none !important;
        animation: none !important;
      }

      .calligraphy-spark {
        display: none !important;
      }

      .flourish-path {
        stroke-dashoffset: 0 !important;
        animation: none !important;
      }
    }

    .amp {
      font-family: var(--serif);
      font-style: italic;
      color: var(--gold);
      font-size: clamp(1.5rem, 5vw, 2rem);
      display: block;
      margin: 6px 0
    }

    .big {
      font-size: clamp(2.3rem, 7vw, 3.2rem);
      line-height: 1.15
    }

    .quote {
      font-family: var(--serif);
      font-style: italic;
      font-size: clamp(1.3rem, 4.6vw, 1.65rem);
      line-height: 1.6;
      max-width: 30ch;
      margin: 0 auto
    }

    .body {
      font-family: var(--serif);
      font-size: clamp(1.25rem, 4.4vw, 1.5rem);
      line-height: 1.7;
      max-width: 34ch;
      margin: 0 auto
    }

    .small {
      font-size: .85rem;
      color: var(--mute);
      letter-spacing: .04em
    }

    .alt {
      background: var(--cream)
    }

    .rule {
      height: 1px;
      width: 64px;
      background: var(--gold);
      margin: 36px auto
    }

    .orn {
      display: block;
      margin: 36px auto;
      width: 150px;
      height: 18px;
      color: var(--gold)
    }

    /* ===== Luxury Fullscreen Hero Cover (Tap to Open) ===== */
    #hero {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      overflow: hidden;
      box-sizing: border-box;
      padding: 0;
      margin: 0;
      background-color: #0e0a07;
      z-index: 1000;
      user-select: none;
      -webkit-user-select: none;
      transition: opacity 1.3s cubic-bezier(0.25, 1, 0.4, 1), transform 1.3s cubic-bezier(0.25, 1, 0.4, 1);
      will-change: opacity, transform;
    }

    #hero.leaving, #hero.opened {
      opacity: 0;
      visibility: hidden;
      transform: scale(1.03);
      pointer-events: none !important;
    }

    .hero-bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      z-index: 1;
    }

    .hero-bg img {
      object-fit: cover;
      object-position: center 22%;
      width: 100%;
      height: 100%;
      animation: 16s ease-out infinite alternate heroZoom;
      display: block;
    }

    @keyframes heroZoom {
      0% {
        transform: scale(1);
      }
      100% {
        transform: scale(1.08);
      }
    }

    .hero-overlay {
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      background: linear-gradient(
        180deg,
        rgba(14, 10, 7, 0.45) 0%,
        rgba(14, 10, 7, 0.08) 25%,
        rgba(14, 10, 7, 0.25) 50%,
        rgba(14, 10, 7, 0.76) 75%,
        rgba(14, 10, 7, 0.96) 95%
      );
    }

    .hero-border {
      position: absolute;
      inset: 14px;
      border: 1px solid rgba(212, 175, 55, 0.45);
      pointer-events: none;
      z-index: 3;
      box-sizing: border-box;
    }

    .hero-border-inner {
      position: absolute;
      inset: 20px;
      border: 1px solid rgba(212, 175, 55, 0.22);
      pointer-events: none;
      z-index: 3;
      box-sizing: border-box;
    }

    .hero-top {
      position: relative;
      z-index: 4;
      padding-top: clamp(26px, 5.5vh, 42px);
      text-align: center;
      width: 100%;
      pointer-events: none;
    }

    .hero-tagline {
      display: inline-block;
      font-family: var(--sans);
      font-size: clamp(0.68rem, 2vw, 0.76rem);
      letter-spacing: 0.38em;
      text-transform: uppercase;
      color: #dfca95;
      font-weight: 500;
      text-shadow: 0 1px 8px rgba(0, 0, 0, 0.75);
    }

    .hero-bottom {
      position: relative;
      z-index: 4;
      padding-bottom: clamp(34px, 7vh, 52px);
      padding-inline: 24px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
    }

    .hero-names {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin-bottom: 12px;
    }

    .hero-name {
      font-family: var(--serif);
      font-size: clamp(2.3rem, 7.5vw, 3.2rem);
      font-weight: 400;
      line-height: 1.15;
      letter-spacing: 0.16em;
      color: #ffffff;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8);
      margin: 0;
      text-transform: capitalize;
    }

    .hero-amp {
      font-family: 'Alex Brush', 'Cormorant Garamond', cursive, serif;
      font-style: italic;
      font-size: clamp(1.4rem, 4.5vw, 1.85rem);
      color: #dfca95;
      margin: 2px 0 4px;
      line-height: 1;
      text-shadow: 0 1px 6px rgba(0, 0, 0, 0.8);
    }

    .hero-date {
      font-family: var(--sans);
      font-size: clamp(0.68rem, 2vw, 0.76rem);
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #f1e4cb;
      margin-top: 12px;
      font-weight: 400;
      text-shadow: 0 1px 6px rgba(0, 0, 0, 0.9);
    }

    .hero-venue {
      font-family: var(--sans);
      font-size: clamp(0.66rem, 1.9vw, 0.74rem);
      letter-spacing: 0.14em;
      color: #dfca95;
      margin-top: 6px;
      font-weight: 300;
      text-shadow: 0 1px 6px rgba(0, 0, 0, 0.9);
    }

    .hero-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-top: 24px;
      padding: 13px 38px;
      background: #faf6ee;
      color: #2b241c;
      border: 1px solid #dfca95;
      border-radius: 999px;
      font-family: var(--sans);
      font-size: clamp(0.7rem, 2vw, 0.78rem);
      font-weight: 500;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      text-decoration: none;
      cursor: pointer;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.4), 0 0 16px rgba(223, 202, 149, 0.2);
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), background 0.3s ease, box-shadow 0.3s ease;
      user-select: none;
      -webkit-user-select: none;
    }

    .hero-btn:hover {
      background: #ffffff;
      transform: translateY(-2px) scale(1.02);
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.5), 0 0 24px rgba(223, 202, 149, 0.35);
    }

    .hero-btn:active {
      transform: translateY(0) scale(0.98);
    }

    .mono {
      width: 64px;
      height: 64px;
      border: 1px solid var(--gold);
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-family: var(--serif);
      font-size: 1.05rem;
      letter-spacing: .2em;
      color: var(--gold);
      margin-bottom: 34px;
      padding-left: .2em
    }

    .date {
      font-family: var(--serif);
      font-size: 1.5rem;
      letter-spacing: .14em;
      margin-top: 34px
    }

    .day {
      font-size: .7rem;
      letter-spacing: .32em;
      text-transform: uppercase;
      color: var(--mute);
      margin-top: 2px
    }

    .tag {
      margin: 28px 0 38px;
      color: var(--mute);
      font-size: .9rem
    }

    .btn {
      display: inline-block;
      background: var(--ivory);
      color: var(--ink);
      border: 1px solid var(--gold);
      border-radius: 999px;
      padding: 14px 34px;
      font: 400 .72rem var(--sans);
      letter-spacing: .28em;
      text-transform: uppercase;
      text-decoration: none;
      cursor: pointer;
      min-height: 44px;
      transition: transform .35s ease, background .35s ease, border-color .35s ease
    }

    .btn:hover {
      background: #fff;
      transform: scale(1.03);
      border-color: var(--ink)
    }

    .btn:focus-visible {
      outline: 2px solid var(--gold);
      outline-offset: 3px
    }


    .arch {
      width: min(34vw, 160px, calc(22svh*.75));
      aspect-ratio: 3/4;
      border: 1px solid var(--gold);
      border-radius: 999px 999px 6px 6px;
      padding: 5px;
      margin-bottom: clamp(18px, 4svh, 32px)
    }

    .arch img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: 50% 34%;
      border-radius: 999px 999px 3px 3px
    }

    /* cover */
    #intro {
      padding-top: 0;
      padding-left: 0;
      padding-right: 0;
    }

    #intro .wrap {
      padding-left: 24px;
      padding-right: 24px;
    }

    .cover {
      width: 100%;
      max-width: 640px;
      margin: 0 auto -44px;
      aspect-ratio: 3/4;
      overflow: hidden;
      -webkit-mask-image: linear-gradient(to bottom, #000 68%, transparent 100%);
      mask-image: linear-gradient(to bottom, #000 68%, transparent 100%);
    }

    .cover img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: 50% 28%;
      transform: scale(1.03);
      transition: transform 2.6s ease;
    }

    .cover.in img {
      transform: none
    }

    @media (min-width: 768px) {
      .cover {
        width: 100%;
        max-width: 100%;
        height: 100vh;
        min-height: 100vh;
        aspect-ratio: auto;
        margin: 0 auto;
        -webkit-mask-image: linear-gradient(to bottom, #000 85%, transparent 100%);
        mask-image: linear-gradient(to bottom, #000 85%, transparent 100%);
      }

      .cover img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: 50% 22%;
      }

      #intro .wrap {
        margin-top: clamp(36px, 6vw, 72px);
      }
    }

    @media(prefers-reduced-motion:reduce) {
      .cover img {
        transition: none;
        transform: none
      }
    }

    /* Gallery Fade Transition (Seamless In-Place Crossfade) */
    .gallery-section {
      position: relative;
      padding: clamp(60px, 12vw, 110px) 24px;
    }

    .gallery-fade-wrapper {
      position: relative;
      max-width: 460px;
      margin: 0 auto;
    }

    .gallery-fade-frame {
      position: relative;
      width: 100%;
      aspect-ratio: 4 / 5;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 16px 42px rgba(60, 50, 30, 0.16), 0 2px 10px rgba(184, 152, 90, 0.12);
      background: var(--cream);
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
    }

    .gallery-slide {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      visibility: hidden;
      transition: opacity 1.8s cubic-bezier(0.4, 0, 0.2, 1), visibility 1.8s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 1;
    }

    .gallery-slide.active {
      opacity: 1;
      visibility: visible;
      z-index: 2;
    }

    .gallery-slide img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 25%;
      transform: scale(1.04);
      transition: transform 6s cubic-bezier(0.25, 1, 0.5, 1);
    }

    .gallery-slide.active img {
      transform: scale(1);
    }

    .gallery-frame-border {
      position: absolute;
      inset: 10px;
      border: 1px solid rgba(220, 201, 160, 0.5);
      border-radius: 8px;
      pointer-events: none;
      z-index: 4;
    }

    .gallery-frame-border-inner {
      position: absolute;
      inset: 15px;
      border: 1px solid rgba(184, 152, 90, 0.25);
      border-radius: 5px;
      pointer-events: none;
      z-index: 4;
    }

    .gallery-dots {
      position: absolute;
      bottom: 22px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 8px;
      z-index: 5;
      pointer-events: auto;
      background: rgba(14, 10, 7, 0.38);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      padding: 5px 12px;

    (function initCountdown() {
      const target = new Date('2026-12-26T16:00:00+05:30').getTime();

      const elH = document.getElementById('cd-hours');
      const elM = document.getElementById('cd-minutes');
      const elS = document.getElementById('cd-seconds');
      if (!elD || !elH || !elM || !elS) return;
      function tick() {
        const diff = target - Date.now();
        if (diff <= 0) {
          elD.textContent = '00'; elH.textContent = '00'; elM.textContent = '00'; elS.textContent = '00';
          return;
        }
        const s = Math.floor(diff / 1000);
        elD.textContent = String(Math.floor(s / 86400));
        elH.textContent = String(Math.floor((s % 86400) / 3600)).padStart(2, '0');
        elM.textContent = String(Math.floor((s % 3600) / 60)).padStart(2, '0');
        elS.textContent = String(s % 60).padStart(2, '0');
      }
      tick();
      setInterval(tick, 1000);
    })();

    /* ===== Scroll reveal ===== */
    const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target) } }), { threshold: .15, rootMargin: '0px 0px -6% 0px' });

    /* ===== Prelude: guest taps Open Invitation to enter ===== */
    history.scrollRestoration = 'manual'; scrollTo(0, 0);
    document.documentElement.style.overflow = 'hidden'; document.body.style.overflow = 'hidden';
    let opened = false;
    function openInvite() {
      if (opened) return; opened = true;
      document.documentElement.style.overflow = ''; document.body.style.overflow = '';
      scrollTo(0, 0);
      document.getElementById('hero').classList.add('leaving');
      document.querySelectorAll('.r').forEach(el => io.observe(el));
      playAudio();
      setTimeout(() => {
        const inames = document.querySelector('.intro-names');
        if (inames) inames.classList.add('in');
      }, 450);
      initRosePetals();
    }
    const heroBtn = document.getElementById('hero-open-btn');
    if (heroBtn) {
      heroBtn.addEventListener('click', e => { e.preventDefault(); e.stopPropagation(); openInvite(); });
    }
    const heroBottom = document.querySelector('.hero-bottom');
    if (heroBottom) {
      heroBottom.addEventListener('click', openInvite);
    }

    function playAudio() {
      const audio = document.getElementById('wedding-audio');
      if (!audio) return;
      audio.loop = true;
      audio.volume = 0.05;
      const p = audio.play();
      if (p !== undefined) {
        p.then(() => {
          let v = 0.05;
          const fade = setInterval(() => {
            v = Math.min(0.75, v + 0.05);
            if (audio) audio.volume = v;
            if (v >= 0.75) clearInterval(fade);
          }, 100);
        }).catch(() => {});
      }
    }

    /* ===== Falling Rose Petals (Confined to .cover only, small 3D) ===== */
    let petalsActive = false;
    function initRosePetals() {
      if (petalsActive) return;
      petalsActive = true;
      const cover = document.querySelector('.cover');
      if (!cover) return;

      const ROSE_PALETTES = [
        { front: ['#a81b2c', '#c72438', '#7a0e1c'], back: ['#580812', '#720c19'] },
        { front: ['#921424', '#b51d31', '#6b0b17'], back: ['#4b060e', '#610a14'] },
        { front: ['#ba2136', '#db324b', '#8f1224'], back: ['#630a17', '#7c1020'] },
        { front: ['#d94d65', '#eb6880', '#ad3249'], back: ['#8c1e32', '#a82941'] },
        { front: ['#82101e', '#9e1728', '#5e0813'], back: ['#3e040a', '#540710'] }
      ];
      let canvas = document.getElementById('rose-petals-canvas');
      if (!canvas) {
        canvas = document.createElement('canvas');
        canvas.id = 'rose-petals-canvas';
        canvas.setAttribute('aria-hidden', 'true');
        document.body.appendChild(canvas);
      } else if (canvas.parentElement !== document.body) {
        document.body.appendChild(canvas);
      }
      canvas.style.position = 'fixed';
      canvas.style.top = '0';
      canvas.style.left = '0';
      canvas.style.width = '100vw';
      canvas.style.height = '100vh';
      canvas.style.pointerEvents = 'none';
      canvas.style.zIndex = '50';
      canvas.style.opacity = '0';
      canvas.style.transition = 'opacity 1.5s ease';

      requestAnimationFrame(() => { canvas.style.opacity = '1'; });
      const ctx = canvas.getContext('2d');
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      let width = window.innerWidth;
      let height = window.innerHeight;
      function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = Math.round(width * dpr);
        canvas.height = Math.round(height * dpr);
        canvas.style.width = '100vw';
        canvas.style.height = '100vh';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }
      resize();
      window.addEventListener('resize', resize, { passive: true });

      function spawnPetal(initial) {
        const depth = Math.random();
        // Tiny 3D delicate petals: 4.5px to 10px
        const size = depth < 0.35 ? 4.5 + Math.random() * 1.8 : (depth < 0.8 ? 6.2 + Math.random() * 2.0 : 8.2 + Math.random() * 2.2);
        const speedY = depth < 0.35 ? 0.22 + Math.random() * 0.14 : (depth < 0.8 ? 0.30 + Math.random() * 0.16 : 0.38 + Math.random() * 0.18);
        return {
          x: Math.random() * (width + 40) - 20,
          y: initial ? Math.random() * (height + 40) - 20 : -18 - Math.random() * 25,
          size,
          aspect: 0.70 + Math.random() * 0.16,
          speedY,
          speedX: -0.08 + Math.random() * 0.18,
          angle: Math.random() * Math.PI * 2,
          angleSpeed: (Math.random() - 0.5) * 0.006,
          flip: Math.random() * Math.PI * 2,
          flipSpeed: 0.007 + Math.random() * 0.012,
          pitch: Math.random() * Math.PI * 2,
          pitchSpeed: 0.009 + Math.random() * 0.014,
          swayPhase: Math.random() * Math.PI * 2,
          swaySpeed: 0.006 + Math.random() * 0.009,
          swayAmp: 7 + Math.random() * 10,
          curl: (Math.random() - 0.5) * 0.6,
          palette: ROSE_PALETTES[Math.floor(Math.random() * ROSE_PALETTES.length)],
          opacity: 0.7 + Math.random() * 0.25
        };
      }

      const count = width < 768 ? 16 : 22;
      const petals = [];
      for (let i = 0; i < count; i++) petals.push(spawnPetal(true));

      let lastTime = performance.now();
      let animId = null;

      function drawPetal(p) {
        const w = p.size * p.aspect;
        const h = p.size;
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.angle);
        const flipCos = Math.cos(p.flip);
        const pitchSin = Math.sin(p.pitch);
        ctx.scale(flipCos, 0.93 + pitchSin * 0.07);
        ctx.globalAlpha = p.opacity;
        const isBack = flipCos < 0;
        const colors = isBack ? p.palette.back : p.palette.front;
        const grad = ctx.createLinearGradient(-w * 0.5, -h * 0.5, w * 0.5, h * 0.5);
        grad.addColorStop(0, colors[0]);
        grad.addColorStop(0.5, colors[1]);
        grad.addColorStop(1, colors[colors.length - 1]);
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.moveTo(0, h * 0.48);
        ctx.bezierCurveTo(-w * 0.58, h * 0.22, -w * 0.65, -h * 0.22, -w * 0.22, -h * 0.48);
        ctx.bezierCurveTo(-w * 0.08, -h * 0.51, w * 0.08, -h * 0.51, w * 0.22, -h * 0.48);
        ctx.bezierCurveTo(w * 0.65, -h * 0.22, w * 0.58, h * 0.22, 0, h * 0.48);
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = isBack ? 'rgba(255, 190, 190, 0.14)' : 'rgba(255, 240, 240, 0.22)';
        ctx.lineWidth = Math.max(0.4, w * 0.04);
        ctx.beginPath();
        ctx.moveTo(0, h * 0.42);
        ctx.quadraticCurveTo(p.curl * w * 0.22, 0, 0, -h * 0.38);
        ctx.stroke();
        ctx.restore();
      }

      function loop(now) {
        const dt = Math.min((now - lastTime) / 16.667, 2.0);
        lastTime = now;
        ctx.clearRect(0, 0, width, height);
        for (let i = 0; i < petals.length; i++) {
          const p = petals[i];
          const sway = Math.cos(now * 0.001 * p.swaySpeed + p.swayPhase) * (p.swayAmp * 0.022);
          p.y += p.speedY * dt;
          p.x += (p.speedX + 0.05 + sway) * dt;
          p.angle += p.angleSpeed * dt;
          p.flip += p.flipSpeed * dt;
          p.pitch += p.pitchSpeed * dt;
          if (p.y > height + 25) {
            p.y = -15 - Math.random() * 25;
            p.x = Math.random() * (width + 40) - 20;
          }
          if (p.x < -30) p.x = width + 20;
          else if (p.x > width + 30) p.x = -20;
          drawPetal(p);
        }
        animId = requestAnimationFrame(loop);
      }

      if (!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches)) {
        animId = requestAnimationFrame(loop);
        document.addEventListener('visibilitychange', () => {
          if (document.hidden) {
            if (animId) cancelAnimationFrame(animId);
          } else {
            lastTime = performance.now();
            animId = requestAnimationFrame(loop);
          }
        });
      }

      /* ===== Gallery Crossfade Controller ===== */
      function initGalleryCrossfade() {
        const container = document.getElementById('gallery-crossfade');
        if (!container) return;
        const slides = container.querySelectorAll('.gallery-slide');
        const dots = container.querySelectorAll('.gallery-dot');
        if (slides.length < 2) return;

        let current = 0;
        let timer = null;

        function goToSlide(index) {
          current = index % slides.length;
          slides.forEach((s, i) => {
            s.classList.toggle('active', i === current);
          });
          dots.forEach((d, i) => {
            d.classList.toggle('active', i === current);
          });
        }

        function nextSlide() {
          goToSlide(current + 1);
        }

        function startAuto() {
          stopAuto();
          timer = setInterval(nextSlide, 4200);
        }

        function stopAuto() {
          if (timer) clearInterval(timer);
        }

        container.addEventListener('click', () => {
          nextSlide();
          startAuto();
        });

        dots.forEach(dot => {
          dot.addEventListener('click', (e) => {
            e.stopPropagation();
            const idx = parseInt(dot.getAttribute('data-slide'), 10);
            goToSlide(idx);
            startAuto();
          });
        });

        startAuto();
      }
      initGalleryCrossfade();
  </script>
</body>

</html>
